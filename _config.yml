# Site
title:              "Carlos Hurtado"
bio:                "Welcome to Carlos Hurtado's portfolio and blog"
description:        "Carlos Hurtado is a Technical Lead Manager and game developer with 15+ years shipping award-winning games, including Asgard's Wrath 2 at Sanzaru Games / Meta."
reading_time:       true
words_per_minute:   200
logo:               'assets/img/logo3.png'
#background:         'assets/img/tempBG.jpg'
tiled_bg:           false   # Set this true if you want to tile your background image, otherwise it will be covered
locale:             en_US
url:                "https://www.carloshurtado.com"

# Jekyll
permalink:          /:title/
markdown:           kramdown
highlighter:        rouge
kramdown:
  auto_ids:         true
  footnote_nr:      1
  entity_output:    as_char
  toc_levels:       1..6
  enable_coderay:   false
mathjax:            true
sass:
  sass_dir:         _sass
  style:            compressed
collections:
  gameDevProjects:
    output:         false

teaser: "/assets/img/logo3.png"
og_image: "/assets/img/logo3.png"
# Comments
disqus_shortname:   churtado

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/logo3.png

# Social
# if you don't have any of social below, comment the line.
#google:
  #plus:            #username
  #analytics:
  #verify:
  #ad-client:
  #ad-slot:
#bing-verify:
email:              carloshurtado@gmail.com
twitter:
  username:         carlos_hurtado
  card:             summary_large_image
#facebook:           username
github-url:         c-hurtado
#stackoverflow:     123456/username   from a "http://stackoverflow.com/users/123456/username" link
linkedin:          carloshurtado
#xing:              username
instagram:          chaoticbrain
#lastfm:            username
#tumblr:            username
#medium:            '@username'
#pinterest:         username
#foursquare:        username
#steam:              chaoticbrain
#dribbble:          username
#youtube:           username
#youtube-channel:   channel
#soundcloud:        username
#weibo:             username
#flickr:            username
#codepen:           username
#keybase:           username
#xmpp:              username@server.com
#hackernews:        username
#rss:                1

# Gems
gems:
  - jekyll-mentions
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-seo-tag
  - jekyll-redirect-from
jekyll-mentions:
    base_url: https://github.com

# Exclude list
exclude: [README.md, Gemfile, Gemfile.lock, node_modules, gulpfile.js, package.json, _site, src, vendor, CNAME, LICENSE, Rakefile]

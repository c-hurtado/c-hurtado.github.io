<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #08010f;
    --bg2: #0f0520;
    --pink: oklch(62% 0.28 340);
    --orange: oklch(68% 0.22 38);
    --purple: oklch(55% 0.25 295);
    --cyan: oklch(72% 0.18 200);
    --text: oklch(92% 0.015 280);
    --text-dim: oklch(65% 0.02 280);
    --card-bg: oklch(5% 0.04 290 / 0.62);
    --border: oklch(55% 0.25 295 / 0.35);
    --glow-pink: oklch(62% 0.28 340 / 0.5);
    --glow-orange: oklch(68% 0.22 38 / 0.4);
  }

{
	color: white;

	color: #ff00cc;

  html { scroll-behavior: smooth; }

<script type="text/babel">

 
const { useState, useEffect, useRef } = React;


// ─── NAV ──────────────────────────────────────────────────────────────────────
function Nav({ activeSection, setActiveSection, accentColor }) {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const handler = () => setScrolled(window.scrollY > 20);
    window.addEventListener('scroll', handler);
    return () => window.removeEventListener('scroll', handler);
  }, []);

  const navItems = [
    { id: 'home', label: 'Home' },
    { id: 'about', label: 'About' },
    { id: 'gamedev', label: 'Game Dev' },
    { id: 'resume', label: 'Resume' },
    { id: 'contact', label: 'Contact' },
  ];

  const accent = accentColor === 'cyan' ? 'var(--cyan)' : accentColor === 'orange' ? 'var(--orange)' : 'var(--pink)';

  return (
    <nav style={{
      position: 'fixed', top: 0, left: 0, right: 0, zIndex: 500,
      padding: '0 40px',
      height: 64,
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      background: scrolled ? 'oklch(8% 0.04 290 / 0.92)' : 'transparent',
      backdropFilter: scrolled ? 'blur(20px)' : 'none',
      borderBottom: scrolled ? '1px solid oklch(55% 0.25 295 / 0.2)' : '1px solid transparent',
      transition: 'all 0.4s ease',
    }}>
      {/* Logo */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <img src="assets/img/logo3.png" alt="Carlos Hurtado" style={{ height: 36, width: 'auto' }} />
      </div>

      {/* Nav links */}
      <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
        {navItems.map(item => (
          <a key={item.id} href={`#${item.id}`}
            onClick={() => setActiveSection(item.id)}
            style={{
              padding: '6px 18px',
              borderRadius: 4,
              fontFamily: 'DM Sans',
              fontSize: 14,
              fontWeight: 500,
              letterSpacing: '0.04em',
              color: activeSection === item.id ? accent : 'var(--text-dim)',
              background: activeSection === item.id ? `oklch(55% 0.25 295 / 0.15)` : 'transparent',
              border: activeSection === item.id ? `1px solid ${accent}40` : '1px solid transparent',
              transition: 'all 0.25s ease',
              cursor: 'pointer',
            }}
            onMouseEnter={e => { if (activeSection !== item.id) { e.target.style.color = 'var(--text)'; }}}
            onMouseLeave={e => { if (activeSection !== item.id) { e.target.style.color = 'var(--text-dim)'; }}}
          >{item.label}</a>
        ))}
      </div>
    </nav>
  );
}

// ─── AVATAR ───────────────────────────────────────────────────────────────────
function AvatarCircle({ size = 160, accentColor }) {
  const accent = accentColor === 'cyan' ? 'var(--cyan)' : accentColor === 'orange' ? 'var(--orange)' : 'var(--pink)';
  return (
    <div style={{
      width: size, height: size, borderRadius: '50%',
      border: `2px solid ${accent}`,
      boxShadow: `0 0 24px ${accent}60, 0 0 60px oklch(55% 0.25 295 / 0.3)`,
      flexShrink: 0,
      overflow: 'hidden',
      background: 'oklch(8% 0.04 290)',
    }}>
      <img
        src="assets/img/mepunk.png"
        alt="Carlos Hurtado"
        style={{ width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'center top', display: 'block' }}
      />
    </div>
  );
}

// ─── SECTION CARD WRAPPER ───────────────────────────────────────────────────
function SectionCard({ children, accentColor, style: extraStyle }) {
  const accent = accentColor === 'cyan' ? 'var(--cyan)' : accentColor === 'orange' ? 'var(--orange)' : 'var(--pink)';
  const accent2 = accentColor === 'orange' ? 'var(--purple)' : 'var(--orange)';
  return (
    <div style={{
      background: 'var(--card-bg)',
      backdropFilter: 'blur(24px)',
      border: '1px solid var(--border)',
      borderRadius: 12,
      padding: '52px 60px',
      position: 'relative',
      boxShadow: '0 0 60px oklch(55% 0.25 295 / 0.12), inset 0 1px 0 oklch(100% 0 0 / 0.05)',
      ...extraStyle,
    }}>
      {/* Top-left corner */}
      <div style={{ position: 'absolute', top: -1, left: -1, pointerEvents: 'none' }}>
        <div style={{ width: 32, height: 32, borderTop: `2px solid ${accent}`, borderLeft: `2px solid ${accent}`, borderRadius: '10px 0 0 0' }} />
      </div>
      {/* Bottom-right corner */}
      <div style={{ position: 'absolute', bottom: -1, right: -1, pointerEvents: 'none' }}>
        <div style={{ width: 32, height: 32, borderBottom: `2px solid ${accent2}`, borderRight: `2px solid ${accent2}`, borderRadius: '0 0 10px 0' }} />
      </div>
      {children}
    </div>
  );
}

// ─── NEON BADGE ───────────────────────────────────────────────────────────────
function NeonBadge({ children, color = 'var(--pink)' }) {
  return (
    <span style={{
      display: 'inline-block',
      padding: '2px 10px',
      borderRadius: 3,
      border: `1px solid ${color}`,
      color: color,
      fontSize: 11,
      fontWeight: 600,
      letterSpacing: '0.08em',
      textTransform: 'uppercase',
      background: `${color}15`,
      boxShadow: `0 0 8px ${color}40`,
      fontFamily: 'Space Grotesk',
    }}>{children}</span>
  );
}

// ─── GLOWING DIVIDER ─────────────────────────────────────────────────────────
function GlowDivider({ color = 'var(--purple)' }) {
  return (
    <div style={{ height: 1, background: `linear-gradient(90deg, transparent, ${color}, transparent)`, margin: '28px 0', opacity: 0.5 }} />
  );
}

// ─── HOME SECTION ─────────────────────────────────────────────────────────────
function HomeSection({ layout, accentColor }) {
  const accent = accentColor === 'cyan' ? 'var(--cyan)' : accentColor === 'orange' ? 'var(--orange)' : 'var(--pink)';
  const accent2 = accentColor === 'orange' ? 'var(--purple)' : 'var(--orange)';

  if (layout === 'fullbleed') {
    return (
      <section id="home" data-screen-label="01 Home" style={{
        minHeight: '100vh', display: 'flex', alignItems: 'center',
        padding: '120px 10% 80px',
        position: 'relative',
      }}>
        <div style={{ display: 'flex', gap: 80, alignItems: 'center', width: '100%', maxWidth: 1100 }}>
          <div style={{ flex: 1 }}>
            <div style={{ marginBottom: 16, display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              <NeonBadge color={accent}>Technical Lead Manager</NeonBadge>
              <NeonBadge color="var(--purple)">Engineering Manager</NeonBadge>
              <NeonBadge color={accent2}>SF Bay Area</NeonBadge>
            </div>
            <h1 style={{
              fontFamily: 'Space Grotesk', fontWeight: 700,
              fontSize: 'clamp(48px, 6vw, 80px)',
              lineHeight: 1.05,
              letterSpacing: '-0.02em',
              marginBottom: 28,
            }}>
              Hi, I'm<br />
              <span style={{
                background: `linear-gradient(135deg, ${accent}, ${accent2})`,
                WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent',
                backgroundClip: 'text',
              }}>Carlos Hurtado.</span>
            </h1>
            <p style={{ fontSize: 18, lineHeight: 1.75, color: 'var(--text-dim)', maxWidth: 560, marginBottom: 16 }}>
              I deliver high-fidelity gaming experiences and lead engineering teams through the full lifecycle of award-winning titles. Most recently Technical Lead at{' '}
              <span style={{ color: 'var(--text)' }}>Sanzaru Games (Meta)</span> on{' '}
              <a href="#gamedev" style={{ color: accent }}>Asgard's Wrath 2</a> — IGN perfect 10/10.
            </p>
            <p style={{ fontSize: 16, lineHeight: 1.7, color: 'var(--text-dim)', maxWidth: 540, marginBottom: 36 }}>
              Expertise in Unreal Engine 4 & 5, C++, performance optimization, and people leadership. Currently seeking <span style={{ color: 'var(--text)' }}>Engineering Manager</span> or <span style={{ color: 'var(--text)' }}>Technical Lead</span> roles.
            </p>
            <div style={{ display: 'flex', gap: 16, flexWrap: 'wrap', alignItems: 'center' }}>
              <a href="https://www.carloshurtado.com/assets/Carlos_Hurtado_Resume.pdf" target="_blank" style={{
                padding: '12px 28px', borderRadius: 4,
                background: `linear-gradient(135deg, ${accent}, ${accent2})`,
                color: '#fff', fontWeight: 600, fontSize: 15,
                fontFamily: 'Space Grotesk', letterSpacing: '0.04em',
                boxShadow: `0 4px 24px ${accent}50`,
                transition: 'all 0.2s ease',
                display: 'inline-block',
              }}
              onMouseEnter={e => e.currentTarget.style.transform = 'translateY(-2px)'}
              onMouseLeave={e => e.currentTarget.style.transform = 'translateY(0)'}
              >Download Resume</a>
              <a href="#contact" style={{
                padding: '12px 28px', borderRadius: 4,
                border: `1px solid ${accent}60`,
                color: accent, fontWeight: 600, fontSize: 15,
                fontFamily: 'Space Grotesk', letterSpacing: '0.04em',
                transition: 'all 0.2s ease',
                display: 'inline-block',
              }}
              onMouseEnter={e => { e.currentTarget.style.background = `${accent}15`; e.currentTarget.style.transform = 'translateY(-2px)'; }}
              onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.transform = 'translateY(0)'; }}
              >Get in Touch</a>
            </div>
            <SocialLinks style={{ marginTop: 40 }} accent={accent} />
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 24, flexShrink: 0 }}>
            <AvatarCircle size={240} accentColor={accentColor} />
            <div style={{ textAlign: 'center', fontSize: 13, color: 'var(--text-dim)', letterSpacing: '0.04em' }}>
              <div style={{ fontWeight: 600, color: 'var(--text)', marginBottom: 4 }}>Open to Work</div>
              <div>Engineering Manager · Tech Lead</div>
            </div>
          </div>
        </div>
      </section>
    );
  }

  // Card layout
  return (
    <section id="home" data-screen-label="01 Home" style={{
      minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center',
      padding: '100px 24px 80px',
      position: 'relative',
    }}>
      <div style={{
        width: '100%', maxWidth: 700,
        background: 'var(--card-bg)',
        backdropFilter: 'blur(24px)',
        border: `1px solid var(--border)`,
        borderRadius: 12,
        padding: '48px 52px',
        boxShadow: `0 0 60px oklch(55% 0.25 295 / 0.15), 0 0 120px oklch(62% 0.28 340 / 0.08), inset 0 1px 0 oklch(100% 0 0 / 0.06)`,
        position: 'relative',
      }}>
        {/* Corner accent */}
        <div style={{ position: 'absolute', top: -1, left: -1, width: 60, height: 60, overflow: 'hidden', pointerEvents: 'none' }}>
          <div style={{ position: 'absolute', top: 0, left: 0, width: 0, height: 0,
            borderTop: `2px solid ${accent}`, borderLeft: `2px solid ${accent}`, width: 30, height: 30, borderRadius: '10px 0 0 0' }} />
        </div>
        <div style={{ position: 'absolute', bottom: -1, right: -1, width: 60, height: 60, overflow: 'hidden', pointerEvents: 'none' }}>
          <div style={{ position: 'absolute', bottom: 0, right: 0,
            borderBottom: `2px solid ${accent2}`, borderRight: `2px solid ${accent2}`, width: 30, height: 30, borderRadius: '0 0 10px 0' }} />
        </div>

        {/* Avatar + greeting */}
        <div style={{ display: 'flex', alignItems: 'flex-start', gap: 28, marginBottom: 32 }}>
          <AvatarCircle size={100} accentColor={accentColor} />
          <div>
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 10 }}>
              <NeonBadge color={accent}>Technical Lead Manager</NeonBadge>
              <NeonBadge color="var(--purple)">Engineering Manager</NeonBadge>
            </div>
            <h1 style={{ fontFamily: 'Space Grotesk', fontSize: 32, fontWeight: 700, lineHeight: 1.1, letterSpacing: '-0.01em' }}>
              Hi, I'm{' '}
              <span style={{
                background: `linear-gradient(135deg, ${accent}, ${accent2})`,
                WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text',
              }}>Carlos Hurtado.</span>
            </h1>
            <div style={{ marginTop: 6, fontSize: 13, color: 'var(--text-dim)' }}>SF Bay Area · Open to Work</div>
          </div>
        </div>

        <GlowDivider />

        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <p style={{ fontSize: 15, lineHeight: 1.78, color: 'var(--text-dim)' }}>
            I am a <a href="#gamedev" style={{ color: accent, fontWeight: 600 }}>Technical Lead Manager</a> with over 15 years of experience delivering high-fidelity gaming experiences and leading engineering teams through the full lifecycle of award-winning titles.
          </p>
          <p style={{ fontSize: 15, lineHeight: 1.78, color: 'var(--text-dim)' }}>
            Most recently at <span style={{ color: 'var(--text)' }}>Sanzaru Games (Oculus Studios · Meta)</span>, contributing to{' '}
            <a href="#gamedev" style={{ color: accent }}>Asgard's Wrath 2</a> — which received a perfect{' '}
            <a href="https://www.ign.com/articles/asgards-wrath-2-review" target="_blank" style={{ color: accent2, fontWeight: 700 }}>10/10 from IGN</a>.
          </p>
          <p style={{ fontSize: 15, lineHeight: 1.78, color: 'var(--text-dim)' }}>
            Expertise in <span style={{ color: 'var(--text)' }}>Unreal Engine 4 & 5</span>, performance optimization, and architecting high-scale gameplay systems in <span style={{ color: 'var(--text)' }}>C++</span>. Currently seeking <span style={{ color: 'var(--text)' }}>Engineering Manager</span> or <span style={{ color: 'var(--text)' }}>Technical Lead</span> roles.
          </p>
        </div>

        <GlowDivider />

        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 20 }}>
          <SocialLinks accent={accent} />
          <a href="https://www.carloshurtado.com/assets/Carlos_Hurtado_Resume.pdf" target="_blank" style={{
            padding: '10px 24px', borderRadius: 4,
            background: `linear-gradient(135deg, ${accent}, ${accent2})`,
            color: '#fff', fontWeight: 600, fontSize: 14,
            fontFamily: 'Space Grotesk', letterSpacing: '0.04em',
            boxShadow: `0 4px 20px ${accent}40`,
            display: 'inline-flex', alignItems: 'center', gap: 8,
            transition: 'all 0.2s ease',
          }}
          onMouseEnter={e => e.currentTarget.style.transform = 'translateY(-2px)'}
          onMouseLeave={e => e.currentTarget.style.transform = 'translateY(0)'}
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download Resume
          </a>
        </div>
      </div>
    </section>
  );
}

// ─── SOCIAL LINKS ─────────────────────────────────────────────────────────────
function SocialLinks({ accent, style: extraStyle }) {
  const links = [
    { href: 'mailto:carloshurtado@gmail.com', label: 'Email', icon: 'M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z M22,6 L12,13 L2,6' },
    { href: 'http://linkedin.com/in/carloshurtado', label: 'LinkedIn', icon: 'M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z M2 9h4v12H2z M4 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4z' },
    { href: 'http://github.com/c-hurtado', label: 'GitHub', icon: 'M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22' },
    { href: 'http://twitter.com/carlos_hurtado', label: 'Twitter/X', icon: 'M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z' },
    { href: 'http://instagram.com/chaoticbrain', label: 'Instagram', icon: 'M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z M17.5 6.5h.01 M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5z' },
  ];
  return (
    <div style={{ display: 'flex', gap: 12, alignItems: 'center', ...extraStyle }}>
      {links.map(link => (
        <a key={link.label} href={link.href} target="_blank" title={link.label} style={{
          width: 36, height: 36, borderRadius: 6,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          border: '1px solid oklch(55% 0.25 295 / 0.25)',
          color: 'var(--text-dim)',
          transition: 'all 0.2s ease',

    <div onClick={onClick} onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)} style={{
      aspectRatio: '1', overflow: 'hidden', borderRadius: 6, cursor: 'pointer',
      border: `1px solid ${hovered ? accent : 'oklch(55% 0.25 295 / 0.2)'}`,
      transition: 'all 0.2s ease',
      transform: hovered ? 'scale(1.03)' : 'scale(1)',
      boxShadow: hovered ? `0 4px 24px ${accent}40` : 'none',
    }}>
      <img src={src} style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block',
        transition: 'opacity 0.2s', opacity: hovered ? 1 : 0.85 }} />
    </div>
  );
}

function HorizonLine() {

      height: 2, zIndex: 2, pointerEvents: 'none',
      background: 'linear-gradient(90deg, transparent 0%, #cc22ff 15%, #ff2d78 35%, #ff9933 50%, #ff2d78 65%, #cc22ff 85%, transparent 100%)',

    }} />
  );
}

// ─── SCROLL TRACKER ───────────────────────────────────────────────────────────
function useActiveSection() {
  const [active, setActive] = useState('home');
  useEffect(() => {
    const sections = ['home', 'about', 'gamedev', 'resume', 'contact'];
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) setActive(entry.target.id);
      });
    }, { threshold: 0.3 });
    sections.forEach(id => {
      const el = document.getElementById(id);
      if (el) observer.observe(el);
    });
    return () => observer.disconnect();
  }, []);
  return [active, setActive];
}

<!-- Animated background: cycles between blue and purple -->
<script>
(function() {
  var t = 0;
  setInterval(function() {
    t += 0.003;
    // Slow sine 0..1
    var s = (Math.sin(t) + 1) / 2;
    // Hue stays in blue-purple range: 220 (blue) <-> 290 (purple)
    var h1 = 220 + s * 70;   // 220 (blue) -> 290 (purple)
    var h2 = 240 + s * 50;   // 240 (indigo) -> 290 (purple)
    var h3 = 210 + s * 80;   // 210 (blue) -> 290 (purple)

    var col1 = "hsl(" + h1 + ", 75%, 16%)";
    var col2 = "hsl(" + h2 + ", 65%, 8%)";
    var col3 = "hsl(" + h3 + ", 60%, 12%)";
    var col4 = "hsl(" + h2 + ", 55%, 5%)";

    document.body.style.backgroundImage =
      "radial-gradient(ellipse at 25% 35%, " + col1 + " 0%, transparent 60%)," +
      "radial-gradient(ellipse at 75% 25%, " + col3 + " 0%, transparent 55%)," +
      "radial-gradient(ellipse at 50% 75%, " + col2 + " 0%, transparent 65%)," +
      "linear-gradient(180deg, " + col4 + " 0%, #03010a 100%)";
  }, 16);
})();
</script>

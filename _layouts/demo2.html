/* Retro synthwave grid horizon (mirrors _sass/elements.scss, inlined here
   because this layout ships its own standalone <style> block). */
.grid-wrapper {
  position: fixed;
  width: 100%;
  height: 500px;
  left: 0;
  bottom: 0px;
  perspective: 200px;
  overflow: hidden;
  z-index: 0;
  pointer-events: none;
}

.grid {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  width: 100%;
  height: 100%;
  background-image: linear-gradient(to bottom, #00000000 50%, #1a0018 70%);
  transform: rotateX(60deg);
  -webkit-transform: rotateX(60deg);
  -o-transform: rotateX(60deg);
}

.line {
  position: absolute;
  background: rgba(87, 193, 232, 0.35);
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}

.vertical .line {
  top: 0; left: 0; bottom: 0;
  width: 2px;
  background: linear-gradient(0deg, rgba(87,193,232,0.4) 0%, rgba(204,34,255,0.35) 55%, rgba(255,45,120,0) 100%);
}
.vertical .line:nth-child(1) { left: 10%; }
.vertical .line:nth-child(2) { left: 20%; }
.vertical .line:nth-child(3) { left: 30%; }
.vertical .line:nth-child(4) { left: 40%; }
.vertical .line:nth-child(5) { left: 50%; }
.vertical .line:nth-child(6) { left: 60%; }
.vertical .line:nth-child(7) { left: 70%; }
.vertical .line:nth-child(8) { left: 80%; }
.vertical .line:nth-child(9) { left: 90%; }
.vertical .line:nth-child(10) { left: 100%; margin-left: -1px; }

.horizontal .line { top: 0; left: 0; right: 0; height: 2px; z-index: 2; }
.horizontal .line:nth-child(1)  { top: 10%;  opacity: 0.2;  background: rgba(255,45,120,0.6);  animation: moveLine10 20s linear infinite; animation-delay: -2s; }
.horizontal .line:nth-child(2)  { top: 20%;  opacity: 0.3;  background: rgba(236,62,133,0.6);  animation: moveLine10 20s linear infinite; animation-delay: -4s; }
.horizontal .line:nth-child(3)  { top: 30%;  opacity: 0.4;  background: rgba(218,78,145,0.6);  animation: moveLine10 20s linear infinite; animation-delay: -6s; }
.horizontal .line:nth-child(4)  { top: 40%;  opacity: 0.5;  background: rgba(199,94,157,0.6);  animation: moveLine10 20s linear infinite; animation-delay: -8s; }
.horizontal .line:nth-child(5)  { top: 50%;  opacity: 0.6;  background: rgba(180,111,170,0.6); animation: moveLine10 20s linear infinite; animation-delay: -10s; }
.horizontal .line:nth-child(6)  { top: 60%;  opacity: 0.7;  background: rgba(162,127,182,0.6); animation: moveLine10 20s linear infinite; animation-delay: -12s; }
.horizontal .line:nth-child(7)  { top: 70%;  opacity: 0.8;  background: rgba(143,144,195,0.6); animation: moveLine10 20s linear infinite; animation-delay: -14s; }
.horizontal .line:nth-child(8)  { top: 80%;  opacity: 0.9;  background: rgba(124,160,207,0.6); animation: moveLine10 20s linear infinite; animation-delay: -16s; }
.horizontal .line:nth-child(9)  { top: 90%;  opacity: 0.95; background: rgba(106,177,220,0.6); animation: moveLine10 20s linear infinite; animation-delay: -18s; }
.horizontal .line:nth-child(10) { top: 100%; margin-top: -1px; opacity: 1; background: rgba(87,193,232,0.6); animation: moveLine10 20s linear infinite; }
.horizontal .line:nth-child(11) { opacity: 0.05; }

.dot {
  position: absolute;
  cursor: pointer;
  background: #57C1E8;
  width: 3px;
  height: 3px;
  top: 100%;
  border-radius: 2px;
  box-shadow: 0 0 3px #fff;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  pointer-events: auto;
}
.dot:nth-child(1) { left: 10%; animation: moveDot 5s infinite; }
.dot:nth-child(2) { left: 20%; animation: moveDot 20s infinite; }
.dot:nth-child(3) { left: 30%; animation: moveDot 15s infinite; }
.dot:nth-child(4) { left: 50%; animation: moveDot 30s infinite; }
.dot:nth-child(5) { left: 60%; animation: moveDot 12s infinite; }
.dot:nth-child(6) { left: 80%; animation: moveDot 6s infinite; }
.dot:nth-child(7) { left: 90%; animation: moveDot 8s infinite; }

@keyframes moveDot {
  0%   { top: 100%; opacity: 1; }
  100% { top: 0%; opacity: 0; }
}

@keyframes moveLine10 {
  0%   { top: 0%; opacity: 0; }
  100% { top: 100%; opacity: 1; }
}

@media (max-width: 480px) {
  .horizontal .line, .dot { animation: none !important; }
}

/* ── SUN EXPERIMENT — delete this whole block to remove it ────────────── */
body::before, body::after {
  content: '';
  position: fixed;
  left: 50%;
  bottom: 318px;
  width: 650px;
  height: 650px;
  background: radial-gradient(circle 140px at center,
    #fff5b0 0px,
    #ffcc66 35px,
    #ff9933 63px,
    #ff2d78 93px,
    rgba(255,45,120,0.12) 96px,
    rgba(255,153,51,0.06) 152px,
    transparent 280px);
  z-index: 0;
  pointer-events: none;
  animation: sun-pulse 5s ease-in-out infinite;
}
body::before {
  clip-path: inset(0 0 50% 0); /* top half — sun */
}
body::after {
  clip-path: inset(50% 0 0 0); /* bottom half — faint reflection */
  opacity: 0.05;
  filter: blur(4px);
}
@keyframes sun-pulse {
  0%, 100% { transform: translate(-50%, calc(50% + var(--sun-drift, 0px))) scale(1); }
  50% { transform: translate(-50%, calc(50% + var(--sun-drift, 0px))) scale(1.025); }
}
@media (prefers-reduced-motion: reduce) {
  body::before, body::after { animation: none; transform: translate(-50%, 50%); }
}
/* ── END SUN EXPERIMENT ─────────────────────────────────────────────────── */

/* Static (non-React) so it paints immediately with the rest of the
   background, instead of waiting on Babel/React to mount. */
.horizon-line {
  position: fixed;
  bottom: 318px;
  left: 0;
  right: 0;
  height: 2px;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(90deg, transparent 0%, #cc22ff 15%, #ff2d78 35%, #ff9933 50%, #ff2d78 65%, #cc22ff 85%, transparent 100%);
  filter: blur(0.5px);
  box-shadow: 0 0 10px #ff2d78, 0 0 25px #e100ff, 0 0 50px #aa00ff30;
}

.reveal {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
}
.reveal-visible {
  opacity: 1;
  transform: translateY(0);
}
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
}

<script type="text/babel">

 
const { useState, useEffect, useRef, useMemo } = React;

// ─── ACCENT COLOR ───────────────────────────────────────────────────────────
function useAccent(accentColor) {
  return {
    accent: accentColor === 'cyan' ? 'var(--cyan)' : accentColor === 'orange' ? 'var(--orange)' : 'var(--pink)',
    accent2: accentColor === 'orange' ? 'var(--purple)' : 'var(--orange)',
  };
}


// ─── NAV ──────────────────────────────────────────────────────────────────────
function Nav({ activeSection, setActiveSection, accentColor }) {
  const [scrolled, setScrolled] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  useEffect(() => {
    const handler = () => setScrolled(window.scrollY > 20);
    window.addEventListener('scroll', handler);
    return () => window.removeEventListener('scroll', handler);
  }, []);

  useEffect(() => {
    const handler = e => { if (e.key === 'Escape') setMenuOpen(false); };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  const handleNavClick = id => {
    setActiveSection(id);
    setMenuOpen(false);
  };

  const navItems = [
    { id: 'home', label: 'Home' },
    { id: 'about', label: 'About' },
    { id: 'gamedev', label: 'Game Dev' },
    { id: 'art', label: 'Art' },
    { id: 'resume', label: 'Resume' },
    { id: 'contact', label: 'Contact' },
  ];

  const { accent } = useAccent(accentColor);

  return (
    <nav style={{
      position: 'fixed', top: 0, left: 0, right: 0, zIndex: 500,
      padding: '0 40px',
      height: 64,
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      background: scrolled ? 'oklch(8% 0.04 290 / 0.92)' : 'transparent',
      backdropFilter: scrolled ? 'blur(20px)' : 'none',
      borderBottom: scrolled ? '1px solid var(--purple-a2)' : '1px solid transparent',
      transition: 'all 0.4s ease',
    }}>
      {/* Logo */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <img src="/assets/img/logo3.png" alt="Carlos Hurtado" style={{ height: 36, width: 'auto' }} />
      </div>

      {/* Nav links */}
      <div className={`nav-links${menuOpen ? ' nav-links-open' : ''}`} style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
        {navItems.map(item => (
          <a key={item.id} href={`#${item.id}`}
            onClick={() => handleNavClick(item.id)}
            style={{
              padding: '6px 18px',
              borderRadius: 4,
              fontFamily: 'DM Sans',
              fontSize: 14,
              fontWeight: 500,
              letterSpacing: '0.04em',
              color: activeSection === item.id ? accent : 'oklch(85% 0.02 280)',
              background: activeSection === item.id ? `var(--purple-a15)` : 'transparent',
              border: activeSection === item.id ? `1px solid ${accent}40` : '1px solid transparent',
              transition: 'all 0.25s ease',
              cursor: 'pointer',
            }}
            onMouseEnter={e => { if (activeSection !== item.id) { e.target.style.color = 'var(--text)'; }}}
            onMouseLeave={e => { if (activeSection !== item.id) { e.target.style.color = 'oklch(85% 0.02 280)'; }}}
          >{item.label}</a>
        ))}
      </div>

      {/* Mobile menu toggle — hidden on desktop, shown via the 768px media query */}
      <button
        className="nav-hamburger"
        aria-label={menuOpen ? 'Close menu' : 'Open menu'}
        aria-expanded={menuOpen}
        onClick={() => setMenuOpen(v => !v)}
        style={{
          display: 'none', alignItems: 'center', justifyContent: 'center',
          width: 36, height: 36, background: 'transparent', border: 'none',
          color: 'var(--text)', cursor: 'pointer', flexShrink: 0,
        }}
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round">
          {menuOpen ? (
            <>
              <line x1="4" y1="4" x2="20" y2="20" />
              <line x1="20" y1="4" x2="4" y2="20" />
            </>
          ) : (
            <>
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </>
          )}
        </svg>
      </button>
    </nav>

// ─── FOCUS TRAP ─────────────────────────────────────────────────────────────
// Keeps Tab/Shift+Tab cycling inside an open modal instead of leaking focus to
// the page behind it, and restores focus to whatever triggered it on close.
function useFocusTrap(active) {
  const ref = useRef(null);
  useEffect(() => {
    if (!active || !ref.current) return;
    const container = ref.current;
    const previouslyFocused = document.activeElement;
    const focusableSelector = 'a[href], button:not([disabled]), [role="button"], [tabindex]:not([tabindex="-1"])';
    const getFocusable = () => Array.from(container.querySelectorAll(focusableSelector));

    (getFocusable()[0] || container).focus();

    const onKeyDown = e => {
      if (e.key !== 'Tab') return;
      const items = getFocusable();
      if (items.length === 0) return;
      const first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    };
    container.addEventListener('keydown', onKeyDown);
    return () => {
      container.removeEventListener('keydown', onKeyDown);
      if (previouslyFocused && previouslyFocused.focus) previouslyFocused.focus();
    };
  }, [active]);
  return ref;
}

// ─── SCROLL REVEAL ────────────────────────────────────────────────────────────
function Reveal({ children }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const observer = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) {
        setVisible(true);
        observer.unobserve(el);
      }
    }, { threshold: 0, rootMargin: '0px 0px -10% 0px' });
    observer.observe(el);
    return () => observer.disconnect();
  }, []);

  const child = React.Children.only(children);
  return React.cloneElement(child, {
    ref,
    className: `${child.props.className || ''} reveal${visible ? ' reveal-visible' : ''}`.trim(),
  });
}

const ART_CATEGORIES_RAW = window.ART_CATEGORIES_RAW;
const ART_PREVIEW_COUNT = 6;

function ArtCategoryGrid({ cat, accent, isLast, onOpen }) {
  const [expanded, setExpanded] = useState(false);
  const hasMore = cat.images.length > ART_PREVIEW_COUNT;
  const visibleImages = expanded ? cat.images : cat.images.slice(0, ART_PREVIEW_COUNT);
  const headerRef = useRef(null);
  const wasExpanded = useRef(false);

  useEffect(() => {
    // Collapsing a large expanded grid can strand the viewport scrolled past
    // the now-much-shorter section — bring the category header back into view.
    if (wasExpanded.current && !expanded && headerRef.current) {
      headerRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    wasExpanded.current = expanded;
  }, [expanded]);

  return (
    <div style={{ marginBottom: isLast ? 0 : 44 }}>
      <div ref={headerRef} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 16, scrollMarginTop: 88 }}>
        <h3 style={{ fontFamily: 'Space Grotesk', fontSize: 17, fontWeight: 600, color: 'var(--text)' }}>{cat.label}</h3>
        <span style={{ fontSize: 12, color: 'var(--text-dim)', letterSpacing: '0.06em', textTransform: 'uppercase' }}>
          {cat.images.length} piece{cat.images.length === 1 ? '' : 's'}
        </span>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(230px, 1fr))', gap: 16 }}>
        {visibleImages.map((src, i) => (
          <ArtThumb key={i} src={src} label={`${cat.label} piece ${i + 1} of ${cat.images.length}`} onClick={() => onOpen(i)} accent={accent} />
        ))}
      </div>
      {hasMore && (
        <button onClick={() => setExpanded(v => !v)} style={{
          display: 'block', margin: '16px auto 0', padding: '8px 20px',
          background: 'transparent', border: `1px solid ${accent}50`, borderRadius: 6,
          color: accent, fontFamily: 'Space Grotesk', fontSize: 13, fontWeight: 600,
          letterSpacing: '0.04em', cursor: 'pointer',
        }}>
          {expanded ? 'Show less' : `Show all ${cat.images.length}`}
        </button>
      )}
    </div>
  );
}

function ArtThumb({ src, onClick, accent, label }) {
  const [hovered, setHovered] = useState(false);
  const [loaded, setLoaded] = useState(false);
  return (
    <div
      role="button" tabIndex={0} aria-label={label}
      onClick={onClick}
      onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick(); } }}
      onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)} style={{
      aspectRatio: '1', overflow: 'hidden', borderRadius: 6, cursor: 'pointer',
      border: `1px solid ${hovered ? accent : 'var(--purple-a2)'}`,
      transition: 'all 0.2s ease',
      transform: hovered ? 'scale(1.03)' : 'scale(1)',
      boxShadow: hovered ? `0 4px 24px ${accent}40` : 'none',
      background: 'linear-gradient(160deg, var(--bg2) 0%, var(--bg) 100%)',
      position: 'relative',
    }}>
      {!loaded && <div className="art-thumb-skeleton"><div className="art-thumb-spinner" /></div>}
      <img src={src} loading="lazy" decoding="async" onLoad={() => setLoaded(true)} style={{ width: '100%', height: '100%', objectFit: 'contain', display: 'block',
        transition: 'opacity 0.3s', opacity: loaded ? (hovered ? 1 : 0.85) : 0 }} />
    </div>
  );
}

// ─── SCROLL TRACKER ───────────────────────────────────────────────────────────
function useActiveSection() {
  const [active, setActive] = useState('home');
  useEffect(() => {
    const sections = ['home', 'about', 'gamedev', 'art', 'resume', 'contact'];
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) setActive(entry.target.id);
      });
    }, { threshold: 0.3 });
    sections.forEach(id => {
      const el = document.getElementById(id);
      if (el) observer.observe(el);
    });
    return () => observer.disconnect();
  }, []);
  return [active, setActive];
}

// ─── APP ──────────────────────────────────────────────────────────────────────
// Reaches outside React on purpose: .grid-wrapper/.horizon-line/.stars/.clouds
// are static HTML (rendered by {% include grid.html %} + a plain <div>, not by
// this React tree — see body markup), so there's nothing for React to manage
// here. Mutating their style.transform directly via querySelector is the
// correct approach, not a shortcut around React.
function useParallaxScroll() {
  useEffect(() => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    const gridWrapper = document.querySelector('.grid-wrapper');
    const horizonLine = document.querySelector('.horizon-line');
    const stars = document.querySelector('.stars');
    const clouds = document.querySelector('.clouds');

    let ticking = false;
    const onScroll = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const y = window.scrollY;
        const gridDrift = Math.min(y * 0.04, 50);   // grid + horizon + sun, capped at 50px
        const starDrift = Math.min(y * 0.015, 30);  // stars/clouds drift slower — depth

        if (gridWrapper) gridWrapper.style.transform = `translateY(${gridDrift}px)`;
        if (horizonLine) horizonLine.style.transform = `translateY(${gridDrift}px)`;
        document.body.style.setProperty('--sun-drift', `${gridDrift}px`);
        if (stars) stars.style.transform = `translateY(${starDrift}px)`;
        if (clouds) clouds.style.transform = `translateY(${starDrift * 1.2}px)`;
        ticking = false;
      });
    };

    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
}

const ACCENT_COLOR = 'pink';

  const [activeSection, setActiveSection] = useActiveSection();

    </>
  );
}
